<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deep Space — Warp Drive</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; overflow: hidden; width: 100vw; height: 100vh; }
  canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="bg"></canvas>  <!-- 星雲・背景レイヤー（低頻度更新） -->
<canvas id="fg"></canvas>  <!-- 星・前景レイヤー（毎フレーム） -->

<script>
/* ══════════════════════════════════════════════════════
   キャンバス設定
══════════════════════════════════════════════════════ */
const bgC = document.getElementById('bg');
const fgC = document.getElementById('fg');
const bg  = bgC.getContext('2d');
const fg  = fgC.getContext('2d');

function resize() {
  bgC.width = fgC.width  = window.innerWidth;
  bgC.height= fgC.height = window.innerHeight;
  buildNebulae();
  buildDustLanes();
  renderStaticBG();
}

const W = () => fgC.width;
const H = () => fgC.height;

/* ══════════════════════════════════════════════════════
   ユーティリティ
══════════════════════════════════════════════════════ */
function rnd(a, b) { return a + Math.random() * (b - a); }
function rndInt(a, b) { return Math.floor(rnd(a, b)); }

/* ══════════════════════════════════════════════════════
   星の色パレット
══════════════════════════════════════════════════════ */
const SCOLORS = [
  [255,255,255],[255,255,255],[255,255,255],[255,255,255],[255,255,255],
  [220,235,255],[205,225,255],[185,215,255],[160,200,255],[130,180,255],
  [255,248,220],[255,235,180],[255,210,140],[255,185,110],
  [210,255,245],[180,235,255],
];

/* ══════════════════════════════════════════════════════
   星雲 (Nebula) — offscreen canvas で事前生成
══════════════════════════════════════════════════════ */
const NEBULA_DEFS = [
  { col:[60,100,255],   alpha:0.22, w:0.7, h:0.55, layers:8  },  // 青い星雲
  { col:[160,40,255],   alpha:0.18, w:0.55,h:0.65, layers:7  },  // 紫
  { col:[255,60,100],   alpha:0.15, w:0.6, h:0.45, layers:6  },  // ピンク
  { col:[0,210,185],    alpha:0.17, w:0.65,h:0.50, layers:7  },  // シアン
  { col:[255,130,30],   alpha:0.13, w:0.50,h:0.55, layers:6  },  // オレンジ
  { col:[80,200,255],   alpha:0.20, w:0.72,h:0.48, layers:8  },  // 空色
  { col:[180,255,150],  alpha:0.11, w:0.48,h:0.60, layers:5  },  // 淡緑
  { col:[255,200,60],   alpha:0.12, w:0.55,h:0.42, layers:5  },  // 黄金
  { col:[120,60,255],   alpha:0.19, w:0.62,h:0.58, layers:7  },  // インディゴ
];

const nebulae = [];

function buildNebulae() {
  nebulae.length = 0;
  // 4〜6個同時表示、画面の広い範囲に散らばせる
  const count = 5 + rndInt(0, 2);
  const shuffled = [...NEBULA_DEFS].sort(() => Math.random()-0.5).slice(0, count);
  shuffled.forEach((def, i) => {
    const nw = Math.floor(W() * def.w);
    const nh = Math.floor(H() * def.h);
    const oc  = makeNebulaOC(nw, nh, def);
    // 全画面に散らばせる（クラスター感を出すため少しオフセット）
    const cx  = W() * (0.1 + (i % 3) * 0.38 + rnd(-0.08, 0.08));
    const cy  = H() * (0.12 + Math.floor(i/3) * 0.45 + rnd(-0.08, 0.08));
    nebulae.push({
      oc, nw, nh, cx, cy,
      z:    rnd(0.3, 0.9),
      spd:  rnd(0.00006, 0.00018),
      vx:   rnd(-0.04, 0.04),
      vy:   rnd(-0.03, 0.03),
      def,
      rot:  rnd(0, Math.PI * 2),
      rotSpd: rnd(-0.0002, 0.0002),
    });
  });
}

function makeNebulaOC(nw, nh, def) {
  const oc  = document.createElement('canvas');
  oc.width  = nw; oc.height = nh;
  const c   = oc.getContext('2d');
  const [r,g,b] = def.col;

  for (let L = 0; L < def.layers; L++) {
    const lx  = nw/2 + rnd(-nw*0.3, nw*0.3);
    const ly  = nh/2 + rnd(-nh*0.3, nh*0.3);
    const rx  = nw * rnd(0.2, 0.45);
    const ry  = nh * rnd(0.15, 0.40);
    const rot = rnd(0, Math.PI);
    const a   = def.alpha * rnd(0.4, 1.0);

    c.save();
    c.translate(lx, ly);
    c.rotate(rot);
    c.scale(1, ry/rx);
    const grd = c.createRadialGradient(0,0,0, 0,0, rx);
    grd.addColorStop(0,   `rgba(${r},${g},${b},${a})`);
    grd.addColorStop(0.4, `rgba(${r},${g},${b},${a*0.45})`);
    grd.addColorStop(0.75,`rgba(${r},${g},${b},${a*0.12})`);
    grd.addColorStop(1,   `rgba(${r},${g},${b},0)`);
    c.beginPath();
    c.arc(0, 0, rx, 0, Math.PI*2);
    c.fillStyle = grd;
    c.fill();
    c.restore();
  }

  // 内部に小輝点（星団核のような輝き）
  for (let s = 0; s < 30; s++) {
    const sx = rnd(nw*0.2, nw*0.8);
    const sy = rnd(nh*0.2, nh*0.8);
    const sr = rnd(0.5, 2.5);
    c.beginPath();
    c.arc(sx, sy, sr, 0, Math.PI*2);
    c.fillStyle = `rgba(${Math.min(255,r+60)},${Math.min(255,g+60)},${Math.min(255,b+60)},${rnd(0.3,0.7)})`;
    c.fill();
  }

  return oc;
}

/* ══════════════════════════════════════════════════════
   ダストレーン（暗黒星雲 / 宇宙塵）
══════════════════════════════════════════════════════ */
const dustLanes = [];

function buildDustLanes() {
  dustLanes.length = 0;
  for (let i = 0; i < 5; i++) {
    const oc = makeDustOC();
    dustLanes.push({
      oc,
      x: rnd(0, W()),
      y: rnd(0, H()),
      w: Math.floor(W() * rnd(0.4, 0.85)),
      h: Math.floor(H() * rnd(0.08, 0.25)),
      rot: rnd(-0.4, 0.4),
      alpha: rnd(0.12, 0.28),
    });
  }
}

function makeDustOC() {
  const oc = document.createElement('canvas');
  oc.width = 600; oc.height = 120;
  const c  = oc.getContext('2d');
  for (let i = 0; i < 8; i++) {
    const grd = c.createRadialGradient(
      rnd(100,500), rnd(20,100), 0,
      rnd(100,500), rnd(20,100), rnd(40,90)
    );
    grd.addColorStop(0,   `rgba(0,0,8,${rnd(0.25,0.5)})`);
    grd.addColorStop(0.6, `rgba(0,0,5,${rnd(0.1,0.2)})`);
    grd.addColorStop(1,   'rgba(0,0,0,0)');
    c.fillStyle = grd;
    c.fillRect(0, 0, 600, 120);
  }
  return oc;
}

/* ══════════════════════════════════════════════════════
   静的背景レンダリング（星雲 + ダストレーン）
══════════════════════════════════════════════════════ */
let bgFrame = 0;

function renderStaticBG() {
  bg.clearRect(0, 0, W(), H());

  // 深宇宙の暗い青黒グラデーション（放射状）
  const grd = bg.createRadialGradient(W()/2,H()/2,0, W()/2,H()/2, Math.max(W(),H())*0.72);
  grd.addColorStop(0,   'rgba(8,14,35,1)');
  grd.addColorStop(0.4, 'rgba(3,6,20,1)');
  grd.addColorStop(1,   'rgba(0,0,4,1)');
  bg.fillStyle = grd;
  bg.fillRect(0, 0, W(), H());

  // ダストレーン
  bg.save();
  bg.globalCompositeOperation = 'multiply';
  dustLanes.forEach(d => {
    bg.save();
    bg.translate(d.x, d.y);
    bg.rotate(d.rot);
    bg.globalAlpha = d.alpha;
    bg.drawImage(d.oc, -d.w/2, -d.h/2, d.w, d.h);
    bg.restore();
  });
  bg.restore();

  // 星雲
  nebulae.forEach(n => {
    const scale = 0.4 + n.z * 1.2;
    const dw = n.nw * scale;
    const dh = n.nh * scale;
    bg.save();
    bg.globalCompositeOperation = 'screen';
    bg.globalAlpha = Math.min(1, n.z * 0.95) * 0.9;
    bg.translate(n.cx, n.cy);
    bg.rotate(n.rot);
    bg.drawImage(n.oc, -dw/2, -dh/2, dw, dh);
    bg.restore();
  });
}

/* ══════════════════════════════════════════════════════
   星
══════════════════════════════════════════════════════ */
const STAR_COUNT = 2600;
const stars = [];

function initStars() {
  stars.length = 0;
  for (let i = 0; i < STAR_COUNT; i++) pushStar(true);
}

function pushStar(init) {
  const angle  = rnd(0, Math.PI * 2);
  const z      = init ? Math.random() : rnd(0, 0.06);
  const speed  = rnd(0.0005, 0.0028);
  const size   = rnd(0.2, 2.8);
  const col    = SCOLORS[rndInt(0, SCOLORS.length)];
  const bright = rnd(0.45, 1.0);
  // 放射源を画面中心からわずかにランダムオフセット（自然感）
  const ox = rnd(-W()*0.02, W()*0.02);
  const oy = rnd(-H()*0.02, H()*0.02);
  stars.push({ angle, z, speed, size, col, bright, ox, oy });
}

initStars();

function starXY(s) {
  const r = s.z * s.z * Math.max(W(), H()) * 0.85;
  return {
    x: W()/2 + s.ox + Math.cos(s.angle) * r,
    y: H()/2 + s.oy + Math.sin(s.angle) * r,
  };
}

/* ══════════════════════════════════════════════════════
   球状星団クラスター
══════════════════════════════════════════════════════ */
const clusters = [];
function initClusters() {
  clusters.length = 0;
  for (let c = 0; c < 5; c++) {
    const cx  = rnd(W()*0.08, W()*0.92);
    const cy  = rnd(H()*0.08, H()*0.92);
    const cnt = rndInt(80, 180);
    const r   = rnd(18, 55);
    const col = SCOLORS[rndInt(0, SCOLORS.length)];
    const pts = [];
    for (let i = 0; i < cnt; i++) {
      const a = rnd(0, Math.PI*2);
      const d = Math.pow(Math.random(), 0.45) * r;
      pts.push({ x: cx+Math.cos(a)*d, y: cy+Math.sin(a)*d, s: rnd(0.2,1.4) });
    }
    clusters.push({ pts, col, alpha: rnd(0.3, 0.6) });
  }
}
initClusters();

/* ══════════════════════════════════════════════════════
   メインアニメーション
══════════════════════════════════════════════════════ */
let frame = 0;
let bgTimer = 0;

function animate() {
  requestAnimationFrame(animate);
  frame++;
  bgTimer++;

  /* ── 星雲を定期的にゆっくり動かす ── */
  if (bgTimer % 3 === 0) {
    nebulae.forEach(n => {
      n.z   += n.spd;
      n.rot += n.rotSpd;
      n.cx  += n.vx;
      n.cy  += n.vy;

      // 画面端を超えたら反対側から
      if (n.cx < -n.nw) n.cx = W() + n.nw/2;
      if (n.cx > W()+n.nw) n.cx = -n.nw/2;
      if (n.cy < -n.nh) n.cy = H() + n.nh/2;
      if (n.cy > H()+n.nh) n.cy = -n.nh/2;

      // z が遠くなりすぎたらリセット
      if (n.z > 1.5) {
        n.z   = rnd(0.05, 0.15);
        n.cx  = rnd(W()*0.05, W()*0.95);
        n.cy  = rnd(H()*0.05, H()*0.95);
        // 新しい星雲を再生成
        const def = NEBULA_DEFS[rndInt(0, NEBULA_DEFS.length)];
        const nw  = Math.floor(W() * def.w);
        const nh  = Math.floor(H() * def.h);
        n.oc = makeNebulaOC(nw, nh, def);
        n.nw = nw; n.nh = nh; n.def = def;
      }
    });
    renderStaticBG();
  }

  /* ── 前景クリア（モーションブラー） ── */
  fg.fillStyle = 'rgba(0,0,6, 0.48)';
  fg.fillRect(0, 0, W(), H());

  /* ── 球状星団 ── */
  fg.save();
  fg.globalCompositeOperation = 'screen';
  clusters.forEach(cl => {
    const [r,g,b] = cl.col;
    cl.pts.forEach(p => {
      fg.beginPath();
      fg.arc(p.x, p.y, p.s, 0, Math.PI*2);
      fg.fillStyle = `rgba(${r},${g},${b},${cl.alpha})`;
      fg.fill();
    });
  });
  fg.restore();

  /* ── 中心グロー ── */
  const cx = W()/2, cy = H()/2;
  const pulse = 0.10 + Math.sin(frame * 0.018) * 0.04;
  const cg = fg.createRadialGradient(cx,cy,0, cx,cy, Math.min(W(),H())*0.38);
  cg.addColorStop(0,   `rgba(255,175,145,${pulse+0.06})`);
  cg.addColorStop(0.18,`rgba(200,160,255,${pulse})`);
  cg.addColorStop(0.5, `rgba(60,80,200,${pulse*0.5})`);
  cg.addColorStop(1,   'rgba(0,0,0,0)');
  fg.fillStyle = cg;
  fg.fillRect(0, 0, W(), H());

  /* ── 星を描く ── */
  for (let i = stars.length-1; i >= 0; i--) {
    const s   = stars[i];
    const pos = starXY(s);

    // 画面外 → リセット
    if (pos.x < -30||pos.x > W()+30||pos.y < -30||pos.y > H()+30) {
      stars.splice(i, 1);
      pushStar(false);
      continue;
    }

    const zf     = Math.min(1, s.z * 1.5);
    const alpha  = zf * s.bright;
    const radius = s.size * (0.2 + s.z * 2.0);
    const [r,g,b] = s.col;

    // ストリーク
    if (s.z > 0.06) {
      const pz = Math.max(0, s.z - s.speed * 6);
      const pr = pz*pz * Math.max(W(),H()) * 0.85;
      const px = W()/2 + s.ox + Math.cos(s.angle)*pr;
      const py = H()/2 + s.oy + Math.sin(s.angle)*pr;
      const sl = Math.min(1, (s.z-0.06)*2.8);
      fg.beginPath();
      fg.moveTo(px, py);
      fg.lineTo(pos.x, pos.y);
      fg.strokeStyle = `rgba(${r},${g},${b},${alpha*0.52*sl})`;
      fg.lineWidth   = radius * 0.48;
      fg.lineCap     = 'round';
      fg.stroke();
    }

    // グロー + コア
    if (s.z > 0.025) {
      const gs = radius * 3.2;
      const sg = fg.createRadialGradient(pos.x,pos.y,0, pos.x,pos.y,gs);
      sg.addColorStop(0,   `rgba(${r},${g},${b},${alpha*0.9})`);
      sg.addColorStop(0.3, `rgba(${r},${g},${b},${alpha*0.28})`);
      sg.addColorStop(1,   `rgba(${r},${g},${b},0)`);
      fg.beginPath();
      fg.arc(pos.x, pos.y, gs, 0, Math.PI*2);
      fg.fillStyle = sg;
      fg.fill();

      fg.beginPath();
      fg.arc(pos.x, pos.y, Math.max(0.4, radius*0.6), 0, Math.PI*2);
      fg.fillStyle = `rgba(${r},${g},${b},${alpha})`;
      fg.fill();
    }

    // 明るい星の光芒（4本＋斜め4本）
    if (s.size > 1.8 && s.z > 0.42) {
      const len  = radius * 9 * s.z;
      const la   = alpha * 0.42 * Math.min(1,(s.z-0.42)*2.2);
      fg.strokeStyle = `rgba(${r},${g},${b},${la})`;
      fg.lineWidth   = 0.5;
      // 十字
      fg.beginPath(); fg.moveTo(pos.x-len,pos.y); fg.lineTo(pos.x+len,pos.y); fg.stroke();
      fg.beginPath(); fg.moveTo(pos.x,pos.y-len); fg.lineTo(pos.x,pos.y+len); fg.stroke();
      // 斜め（短め）
      const dl = len*0.55;
      fg.strokeStyle = `rgba(${r},${g},${b},${la*0.45})`;
      fg.beginPath(); fg.moveTo(pos.x-dl,pos.y-dl); fg.lineTo(pos.x+dl,pos.y+dl); fg.stroke();
      fg.beginPath(); fg.moveTo(pos.x+dl,pos.y-dl); fg.lineTo(pos.x-dl,pos.y+dl); fg.stroke();
    }

    s.z += s.speed;
  }

  /* ── ビネット ── */
  const vR  = Math.max(W(),H()) * 0.82;
  const vig = fg.createRadialGradient(cx,cy,vR*0.22, cx,cy,vR);
  vig.addColorStop(0, 'rgba(0,0,0,0)');
  vig.addColorStop(1, 'rgba(0,1,12,0.90)');
  fg.fillStyle = vig;
  fg.fillRect(0, 0, W(), H());
}

/* ══════════════════════════════════════════════════════
   初期化
══════════════════════════════════════════════════════ */
resize();
initStars();
animate();
window.addEventListener('resize', () => {
  resize();
  initStars();
  initClusters();
});
</script>
</body>
</html>
